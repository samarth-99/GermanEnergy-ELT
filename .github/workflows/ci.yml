name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: dbt parse (no warehouse connection needed)
        working-directory: dbt
        env:
          GCP_PROJECT: dummy-project
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: dbt parse
